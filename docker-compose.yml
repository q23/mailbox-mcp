version: '3.8'

services:
  mailbox-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailbox-mcp
    restart: unless-stopped
    expose:
      - "${PORT:-3000}"
    environment:
      - IMAP_HOST=${IMAP_HOST:-imap.gmail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_TLS=${IMAP_TLS:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_TLS=${SMTP_TLS:-true}
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mailbox-network
    labels:
      - "com.example.description=mailbox-mcp for IMAP and SMTP email integration"

networks:
  mailbox-network:
    driver: bridge
